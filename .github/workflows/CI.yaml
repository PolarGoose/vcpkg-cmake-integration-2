name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build-win.ps1
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build-linux-macos.sh
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build-linux-macos.sh
